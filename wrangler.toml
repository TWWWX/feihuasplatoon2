# Cloudflare Worker：GameRoom Durable Object（WebSocket 实时转发）+ D1 持久化
# 开发：npx wrangler dev    部署：npx wrangler deploy
name = "feihua-realtime"
main = "worker/index.js"
compatibility_date = "2026-09-04"

# D1：rooms 表（room_id / state / updated_at）作为持久化备份
[[d1_databases]]
binding = "DB"
database_name = "feihua-game-db"
database_id = "55ea6d6e-7296-4512-bced-f58f89d58714"

# Durable Object：每房间一个实例，按 roomId 路由
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

# 免费计划必须使用 SQLite 后端的 DO 类
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# 静态资源：前端 dist 与 /ws 同域（未命中资产的请求 fall through 到 Worker 脚本）
[assets]
directory = "./dist"
